<style>
:root{--bg:#0a0f1e;--bg2:#0f1730;--card:#131c36;--card2:#19244a;--line:#243056;--tx:#e8ecf8;--mut:#8b97b8;--ac:#6ea8fe;--go:#2dd4a0;--warn:#f5b73b;--bad:#ff6b7a;--r:14px;color-scheme:dark}
[data-theme=light]{--bg:#f3f5fb;--bg2:#e9edf8;--card:#fff;--card2:#f0f3fb;--line:#d9dff0;--tx:#141a2e;--mut:#5b6685;--ac:#2f6fe4;--go:#0f9d73;--warn:#b7791f;--bad:#d1384a;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;min-height:100vh;padding:env(safe-area-inset-top) 0 40px}
.app{max-width:1100px;margin:0 auto;padding:0 12px}
header{padding:14px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top h1{font-size:19px;font-weight:700;letter-spacing:.2px}
.top small{color:var(--mut);font-size:11px;display:block;font-weight:400}
.clocks{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}
.clk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.clk .l{font-size:10px;color:var(--mut);letter-spacing:.4px}
.clk .t{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-open{background:rgba(45,212,160,.16);color:var(--go)}.b-closed{background:rgba(255,107,122,.16);color:var(--bad)}.b-pre{background:rgba(245,183,59,.16);color:var(--warn)}
.mkt{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:8px}
.mkt b{color:var(--tx);direction:ltr;display:inline-block}
nav.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:11px;font:inherit;font-weight:600;cursor:pointer}
nav.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.tab{display:none;padding-top:14px}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.mut{color:var(--mut)}.sm{font-size:12px}.ltr{direction:ltr;display:inline-block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}

.bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--go))}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.ch{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--mut)}

.wc-f{font-size:12px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.rec{background:var(--card);border:1px solid var(--go);border-radius:var(--r);padding:14px;margin-bottom:14px}
.rec.shadow{border-color:var(--line);border-style:dashed}.rec.late{border-color:var(--warn)}
.rec h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:18px}

.tag.g{background:rgba(45,212,160,.16);color:var(--go)}.tag.w{background:rgba(245,183,59,.16);color:var(--warn)}.tag.r{background:rgba(255,107,122,.16);color:var(--bad)}
.timing{background:var(--bg2);border-radius:10px;padding:8px 10px;margin:10px 0;font-size:13px;line-height:1.9}
table.lv{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}

table.lv td{padding:6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.lv tr.pick td{background:rgba(45,212,160,.10);font-weight:700}
table.lv td.n{direction:ltr;text-align:right}
.ev{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.in{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
.st{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.st div{background:var(--bg2);border-radius:10px;padding:8px 10px}.st b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.st span{font-size:11px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th,table.t td{padding:5px 6px;border-top:1px solid var(--line);text-align:start;font-variant-numeric:tabular-nums}table.t th{color:var(--mut);font-weight:600}
details{margin:6px 0}summary{cursor:pointer;color:var(--ac);font-size:13px}
.lg{border-top:1px solid var(--line);padding:10px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;font-size:13px;max-width:90vw}
@media(max-width:560px){.clk .t{font-size:15px}.grid{grid-template-columns:1fr}}

<body>
<div class="app">
<header>

  <div class="clocks">

</div>
<div class="toast" id="toast" style="display:none"></div>

<script>
(() => {
'use strict';
const VER = '3.1 · 2026-10-20';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const NOW = () => window.__fakeNow || Date.now();
const jget = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f2 = (x, d = 2) => x == null || isNaN(x) ? '—' : (+x).toFixed(d);
const sgn = (x, d = 2) => x == null || isNaN(x) ? '—' : (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ===== الإعدادات =====
const DEF = { alpKey: '', alpSecret: '', fhKey: '', ntfy: '', sound: true, scanOn: true, noEtf: true, theme: 'auto',
  risk: 10, spread: 15, stopMult: 4, minStopC: 15, maxSpread: 20, minPrice: 10, maxPrice: 200, minChg: 3, minRvol: 2, minAvgVolM: 1, minScore: 55, confirmSec: 45,
  winFrom: '09:45', winTo: '11:00', maxRecs: 4, chasePct: 20, stopCap: 35, extPct: 50, noTradeDays: '' };
let cfg = Object.assign({}, DEF, jget('sa3.cfg', {}));
(function migrate() {
  if (!cfg.mig2) { cfg.spread = 15; cfg.mig2 = 1; }
  if (!cfg.fhKey) { const o = jget('tradingAppSettings', {}); if (o && o.finnhubKey) cfg.fhKey = o.finnhubKey; }
  if (!cfg.ntfy) cfg.ntfy = 'scalp-' + Math.random().toString(36).slice(2, 10);
  jset('sa3.cfg', cfg);
})();
const saveCfg = () => jset('sa3.cfg', cfg);

// ===== الوقت =====
const _fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
function nyParts(ms) { const o = {}; for (const p of _fmt.formatToParts(ms)) o[p.type] = p.value; return { y: +o.year, mo: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute, s: +o.second, day: o.year + '-' + o.month + '-' + o.day }; }
function nyWallToMs(day, h, m) { const [Y, M, D] = day.split('-').map(Number), target = Date.UTC(Y, M - 1, D, h, m); let g = target; for (let i = 0; i < 3; i++) { const p = nyParts(g); g += target - Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi); } return g; }
const addDays = (d, n) => new Date(Date.parse(d + 'T12:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const hmv = s => { const [a, b] = String(s).split(':').map(Number); return a * 60 + (b || 0); };
const hmStr = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const tNY = ms => ms ? new Date(ms).toLocaleTimeString('en-GB', { timeZone: 'America/New_York', hour12: false }) : '—';
const tDX = ms => ms ? new Date(ms).toLocaleTimeString('en-GB', { timeZone: 'Asia/Dubai', hour12: false }) : '—';
const isWeekday = day => { const w = new Date(day + 'T12:00:00Z').getUTCDay(); return w !== 0 && w !== 6; };
const marketOpen = (np, mins) => isWeekday(np.day) && mins >= 570 && mins < 960;

// ===== الحالة =====
const S = { uni: [], uniAt: 0, uniSrc: '', snap: {}, bars: {}, ctx: {}, watch: {}, news: {}, day: '', health: {}, status: { msg: '', at: 0, cyc: 0 }, busy: false, proxy: null, spy: null,
  recs: jget('sa3.recs', []), near: jget('sa3.near', []), nearSeen: {}, log: jget('sa3.scanlog', []), cands: [], auditing: false, fhNext: 0, lastErr: '' };
const saveRecs = () => jset('sa3.recs', S.recs.slice(-1500));
const saveNear = () => jset('sa3.near', S.near.slice(-800));
const H = (k, ok, msg) => { S.health[k] = { ok, msg: msg || '', at: NOW() }; };

const FALLBACK = 'AMD,INTC,MU,SMCI,PLTR,SOFI,SNAP,PINS,RBLX,U,DKNG,HOOD,AFRM,UPST,COIN,MARA,RIOT,CLSK,IREN,CIFR,HUT,RGTI,QBTS,IONQ,QUBT,OKLO,SMR,NNE,CCJ,UUUU,LEU,ENPH,SEDG,RUN,FSLR,PLUG,FCEL,BE,JOBY,ACHR,RKLB,ASTS,LUNR,AMC,GME,HIMS,ROKU,SHOP,PYPL,F,GM,RIVN,LCID,NIO,XPEV,LI,BABA,JD,PDD,SOUN,BBAI,APLD,NBIS,NU,PATH,AI,S,DOCN,FUBO,OPEN,CHPT,UAL,AAL,DAL,CCL,NCLH,T,VZ,PFE,BAC,WFC,C,KGC,HL,AG,PAAS,FCX,CLF,AA,OXY,DVN,SLB,HAL,MRNA,NVAX,TLRY,CGC,WBD,PARA,CVNA,ETSY,CHWY,W,LYFT,UBER,DASH,TWLO,PTON,BB,NOK,ERIC,TLN,VST,GEV,FSLY,CCI,VSAT,BKH,NWE,PENG,TXG,CMG,WOLF,ZIM,LW,NVDA,AMZN,TSLA,META,NFLX,AAPL,MSFT,GOOGL,AVGO,CRM,ORCL,UNH,MDB,ARWR,EFXT,KRMN,FIGS,NKE,IP,MNDY,TRU,Z,KMB,BSP,LQDA'.split(',');
const ETFS = new Set('SPY,QQQ,IWM,DIA,TQQQ,SQQQ,SOXL,SOXS,TNA,TZA,UVXY,VXX,SVXY,UPRO,SPXU,SPXS,SPXL,LABU,LABD,FNGU,FNGD,TSLL,TSLQ,TSLS,NVDL,NVDD,NVDQ,CONL,BITO,IBIT,ARKK,XLF,XLE,XLK,XLV,XLY,XLI,XLP,XLU,GLD,SLV,USO,UNG,TLT,HYG,LQD,EEM,EFA,FXI,KWEB,SMH,SOXX,XBI,KRE,GDX,GDXJ,JNUG,JDST,BOIL,KOLD,YINN,YANG,UDOW,SDOW,TECL,TECS,FAS,FAZ,ETHA,FBTC,BITX,QID,QLD,SSO,SDS,PSQ,SH,TMF,TMV,AGQ,UCO,SCO,VOO,VTI,IVV,SCHD,JEPI,JEPQ,ARKG,ARKW'.split(','));
const okSym = s => /^[A-Z]{1,5}$/.test(s) && !(s.length === 5 && s.endsWith('W')) && !(cfg.noEtf && ETFS.has(s));

// ===== Alpaca =====
async function alp(path) {
  const hd = { 'x-alp-key': cfg.alpKey, 'x-alp-secret': cfg.alpSecret };
  let r = null;
  if (S.proxy !== false) {
    try { r = await fetch('/api/alp?p=' + encodeURIComponent(path), { headers: hd, cache: 'no-store' }); } catch (e) { r = null; }
    if (r && (r.status === 404 || !(r.headers.get('content-type') || '').includes('json'))) { S.proxy = false; r = null; } else if (r) S.proxy = true;
  }
  if (!r) {
    try { r = await fetch('https://data.alpaca.markets' + path, { headers: { 'APCA-API-KEY-ID': cfg.alpKey, 'APCA-API-SECRET-KEY': cfg.alpSecret }, cache: 'no-store' }); }
    catch (e) { throw Object.assign(new Error('تعذر الاتصال (شبكة/CORS). ارفع ملف api/alp.js مع الموقع.'), { status: 0 }); }
  }
  const j = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((j && j.message) || ('HTTP ' + r.status)), { status: r.status });
  return j;
}
async function barsQ(syms, tf, start, end, feed) {
  const out = {}; let tok = null, pages = 0;
  do {
    const q = new URLSearchParams({ symbols: syms.join(','), timeframe: tf, start: new Date(start).toISOString(), limit: '10000', adjustment: tf === '1Day' ? 'split' : 'raw' });
    if (end) q.set('end', new Date(end).toISOString()); if (feed) q.set('feed', feed); if (tok) q.set('page_token', tok);
    const j = await alp('/v2/stocks/bars?' + q.toString());
    const b = j.bars || {}; for (const s of Object.keys(b)) (out[s] = out[s] || []).push(...(b[s] || []));
    tok = j.next_page_token; pages++;
  } while (tok && pages < 8);
  return out;
}
const nb = a => (a || []).map(b => { const t = Date.parse(b.t), p = nyParts(t); return { t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v, m: p.h * 60 + p.mi, d: p.day }; });

// ===== مؤشرات =====
function ema(a, n) { const k = 2 / (n + 1), o = []; let e = a[0]; for (const x of a) { e = x * k + e * (1 - k); o.push(e); } return o; }
const rvolOf = (sym, mins) => {
  const c = S.ctx[sym], B = S.bars[sym]; if (!c || !c.base || !B) return null;
  const si = Math.floor((mins - 570) / 5) - 1; if (si < 1 || si > 77) return null;
  const lim = 570 + 5 * (si + 1); let cum = 0; for (const b of B) if (b.m < lim) cum += b.v;
  return c.base[si] > 0 ? cum / c.base[si] : null;
};

// ===== الكون: أكثر الأسهم حركة من السوق =====
async function loadUniverse() {
  const set = new Set(), src = [];
  const tryEp = async (name, path, pick, label) => { try { const j = await alp(path); const a = pick(j) || []; a.forEach(x => set.add(x.symbol)); H(name, true, a.length + ''); src.push(label + ' ' + a.length); } catch (e) { H(name, false, e.message); } };
  await tryEp('movers', '/v1beta1/screener/stocks/movers?top=50', j => j.gainers, 'رابحون');
  await tryEp('actives', '/v1beta1/screener/stocks/most-actives?by=volume&top=50', j => j.most_actives, 'نشطون');
  await tryEp('actives2', '/v1beta1/screener/stocks/most-actives?by=trades&top=30', j => j.most_actives, 'صفقات');
  let list = [...set].filter(okSym);
  if (list.length < 15) { FALLBACK.forEach(s => set.add(s)); list = [...set].filter(okSym); src.push('قائمة ثابتة'); }
  S.uni = list; S.uniAt = NOW(); S.uniSrc = src.join(' · ');
}
async function getSnaps(syms) {
  const out = {};
  for (let i = 0; i < syms.length; i += 80) {
    const part = syms.slice(i, i + 80);
    const j = await alp('/v2/stocks/snapshots?feed=iex&symbols=' + encodeURIComponent(part.join(',')));
    const m = j.snapshots || j;
    for (const s of part) {
      const x = m[s]; if (!x || !x.latestTrade || !x.prevDailyBar || !x.dailyBar) continue;
      out[s] = { p: x.latestTrade.p, tt: Date.parse(x.latestTrade.t), bid: x.latestQuote && x.latestQuote.bp, ask: x.latestQuote && x.latestQuote.ap,
        dO: x.dailyBar.o, dH: x.dailyBar.h, dL: x.dailyBar.l, dV: x.dailyBar.v, dT: Date.parse(x.dailyBar.t), pc: x.prevDailyBar.c };
    }
  }
  H('snap', true, Object.keys(out).length + ''); return out;
}

// ===== سياق كل سهم (يُحمَّل مرة باليوم): متوسط حجم 20 يوم، ATR يومي، خط أساس الحجم =====
function baseCum(b5) {
  const by = {}; for (const b of b5) { if (b.m < 570 || b.m >= 960) continue; (by[b.d] = by[b.d] || []).push(b); }
  const arr = [];
  for (const d of Object.keys(by).sort().slice(-7)) {
    if (by[d].length < 30) continue; const cum = new Array(78).fill(0);
    for (const b of by[d]) cum[Math.floor((b.m - 570) / 5)] += b.v;
    for (let i = 1; i < 78; i++) cum[i] += cum[i - 1]; arr.push(cum);
  }
  const use = arr.slice(-5); if (use.length < 3) return null;
  return Array.from({ length: 78 }, (_, i) => use.reduce((a, c) => a + c[i], 0) / use.length);
}
async function loadCtx(syms, np) {
  const t0 = NOW(), dayStart = nyWallToMs(np.day, 0, 0);

    <div class="mut sm" style="margin-top:8px">الـ CSV صف لكل توصية: أوقات الشروط والإصدار بالثواني، الدخول والوقف والأهداف، أي هدف تحقق ومتى، أدنى/أعلى سعر بعد التوصية، قيم الشروط والزخم، SPY. الـ JSON يضيف شبه التوصيات (اللي كانت قريبة وما صدرت) وسجل المسح.</div></div>
    <div class="card"><h3>🗂 سجل التوصيات</h3>${rows || '<div class="empty">فاضي</div>'}</div>`;
}
const FIELDS = [['h', '🔑 مفاتيح البيانات'], ['alpKey', 'Alpaca — API Key ID', 'text'], ['alpSecret', 'Alpaca — Secret Key', 'password'], ['fhKey', 'Finnhub — للأخبار (اختياري، انتقل تلقائياً من النسخة القديمة)', 'password'],
  ['h', '🔔 التنبيهات'], ['ntfy', 'موضوع ntfy — اشترك فيه بتطبيق ntfy على جوالك', 'text'],
  ['h', '💰 المخاطرة والتكلفة'], ['risk', 'المخاطرة لكل صفقة ($)', 'number'], ['spread', 'سبريد افتراضي (سنت) — يُستخدم فقط لما ما يتوفر bid/ask للسهم', 'number'], ['stopMult', 'أدنى وقف = كم × سبريد السهم', 'number'], ['minStopC', 'أدنى وقف مطلق (سنت)', 'number'], ['maxSpread', 'أقصى سبريد مسموح للسهم (سنت) — فوقه يُرفض', 'number'], ['maxRecs', 'أقصى توصيات تنبيه باليوم (الزائدة تُسجَّل كظل)', 'number'], ['chasePct', 'أقصى مطاردة للشراء (% من R)', 'number'],
  ['h', '🔭 شروط الماسح'], ['minPrice', 'أقل سعر ($)', 'number'], ['maxPrice', 'أعلى سعر ($)', 'number'], ['minChg', 'أقل تغير عن إغلاق أمس (%)', 'number'], ['minRvol', 'أقل حجم نسبي (×)', 'number'], ['minAvgVolM', 'أقل متوسط حجم يومي (مليون)', 'number'], ['minScore', 'أقل درجة زخم (0–100)', 'number'], ['confirmSec', 'ثواني تثبيت الشروط قبل التوصية', 'number'], ['stopCap', 'أقصى وقف (% من المدى اليومي)', 'number'], ['extPct', 'أقصى ابتعاد عن VWAP (% من المدى اليومي) — يمنع المطاردة', 'number'], ['winFrom', 'بداية نافذة التوصيات (نيويورك HH:MM)', 'text'], ['winTo', 'نهاية النافذة (نيويورك)', 'text'], ['noTradeDays', 'أيام بدون تداول (YYYY-MM-DD مفصولة بفاصلة)', 'text']];
function renderSettings() {
  const a = document.activeElement; if (a && a.closest && a.closest('#setv') && /INPUT|SELECT/.test(a.tagName)) return;
  let h = ''; if (!cfg.alpKey) h += `<div class="card" style="border-color:var(--warn)"><b>الخطوة الأولى:</b> سجّل حساب مجاني في <a href="https://app.alpaca.markets/signup" target="_blank" rel="noopener">alpaca.markets</a> (حساب Paper يكفي)، ثم من لوحة Paper Trading اضغط "Generate New Keys" والصق Key ID وSecret هنا.</div>`;
  h += '<div class="card">' + FIELDS.map(f => f[0] === 'h' ? `<h3 style="margin:14px 0 4px">${f[1]}</h3>` : `<label class="f">${f[1]}</label><input class="in" id="f_${f[0]}" type="${f[2]}" value="${esc(cfg[f[0]])}" ${f[2] === 'number' ? 'step="any"' : 'dir="ltr"'}>`).join('');
  h += `<div class="sw"><span>تشغيل الماسح على هذا الجهاز (شغّله على جهاز واحد فقط)</span><input type="checkbox" id="f_scanOn" ${cfg.scanOn ? 'checked' : ''}></div><div class="sw"><span>الصوت</span><input type="checkbox" id="f_sound" ${cfg.sound ? 'checked' : ''}></div><div class="sw"><span>استبعاد صناديق ETF</span><input type="checkbox" id="f_noEtf" ${cfg.noEtf ? 'checked' : ''}></div>
    <label class="f">المظهر</label><select class="in" id="f_theme"><option value="auto">تلقائي</option><option value="dark">داكن</option><option value="light">فاتح</option></select>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="SA.save()">💾 حفظ</button><button class="btn sec" onclick="SA.test()">🔌 اختبار الاتصال</button><button class="btn sec" onclick="SA.perm()">🔔 تفعيل إشعارات المتصفح والصوت</button></div><div id="testOut" class="sm" style="margin-top:10px;line-height:1.9"></div></div>`;
  h += `<div class="card"><h3>ℹ️ طريقة التنبيه على الجوال</h3><div class="sm mut" style="line-height:1.9">1) نزّل تطبيق <b>ntfy</b> على الجوال (مجاني).<br>2) اضغط + واشترك في الموضوع: <b class="ltr">${esc(cfg.ntfy)}</b><br>3) كل توصية (وكل هدف أو وقف) توصلك إشعار حتى لو الجوال مقفل. الماسح لازم يكون شغّال على التابلت والصفحة مفتوحة.</div></div>
    <div class="card"><h3>🧹 بيانات</h3><div class="row"><button class="btn sec" onclick="SA.clearDay()">مسح كاش اليوم</button><button class="btn red" onclick="SA.wipe()">حذف كل السجل</button></div></div>`;
  $('setv').innerHTML = h; $('f_theme').value = cfg.theme;
}
function renderAll() { try { renderHead(); renderPrices(); renderRecs(); if ($('t-log').classList.contains('on')) renderLog(); tickCounters(); } catch (e) { console.error(e); } }
function tickCounters() { const t = NOW(); document.querySelectorAll('.cnt').forEach(e => { const s = (t - +e.dataset.s) / 1000; e.textContent = Math.floor(s) + '/' + e.dataset.n + 'ث'; }); }

// ===== تصدير =====
function recRow(r) {
  const o = outcome(r), A = r.audit, ev = A ? A.ev : r.ev, dd = A ? A.dd : r.dd, c = r.ctx, u = r.user || {}, ts = x => x ? tNY(x) : '';
  return { id: r.id, date: r.day, symbol: r.sym, shadow: r.shadow ? 1 : 0, after10: r.late ? 1 : 0, pattern: r.pattern, tier: r.tier, score: r.score, since_NY: tNY(r.since), since_DXB: tDX(r.since), fired_NY: tNY(r.firedAt), fired_DXB: tDX(r.firedAt), secs_to_fire: r.secs,
    entry: r.entry, max_buy: r.maxBuy, stop: r.stop, R: r.R, tp1: r.tps[0], tp2: r.tps[1], tp3: r.tps[2], rec_tp: r.recIdx + 1, reach: r.reach, room: r.room, far: r.far ? 1 : 0, widened: r.widened ? 1 : 0, shares: r.shares, spread_assumed: r.spread, spread_quoted: r.spreadQ ?? '', stop_dist: r.R,
    bid: r.quote.bid, ask: r.quote.ask, chg_pct: c.chg, gap_pct: c.gap, rvol: c.rvol, vwap: c.vwap, vwap_dist: c.vwapDist, ema_slope: c.slope, atr_1m: c.atr1, atr_daily: c.atrD, avg_vol: c.avgVol, rel_strength: c.rs, spy_chg: c.spyChg, spy_chg_open: c.spyChgOpen, day_low: c.dayLow, day_high: c.dayHigh,
    comp_rvol: r.comp.rvol, comp_slope: r.comp.slope, comp_loc: r.comp.loc, comp_rs: r.comp.rs, comp_struct: r.comp.struct, comp_chg: r.comp.chg,
    tp1_at_NY: ts(ev.tp1), tp2_at_NY: ts(ev.tp2), tp3_at_NY: ts(ev.tp3), stop_at_NY: ts(ev.stop), min_before_tp1: dd[1] ?? '', min_before_tp2: dd[2] ?? '', min_before_tp3: dd[3] ?? '',
    min_after: o.min, max_after: o.max, close_eod: A ? A.close : '', result: o.res, net_R: +o.net.toFixed(3), tp1_hit: o.hit[0] ? 1 : 0, tp2_hit: o.hit[1] ? 1 : 0, tp3_hit: o.hit[2] ? 1 : 0, ambiguous: (A ? A.ambig : r.ambig) ? 1 : 0, audited: A ? A.feed : '',
    news: r.news ? (r.news.flag || r.news.head || '') : '', actual_entry: u.actual ?? '', spread_seen: u.spread ?? '', executed: u.executed ? 1 : 0, note: u.note || '' };
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCSV() { if (!S.recs.length) return toast('لا توصيات للتصدير'); const rows = S.recs.map(recRow), cols = Object.keys(rows[0]); const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  download('scalping-recs-' + nyParts(NOW()).day + '.csv', '﻿' + cols.join(',') + '\n' + rows.map(r => cols.map(c => q(r[c])).join(',')).join('\n'), 'text/csv'); }
function exportJSON() { download('scalping-full-' + nyParts(NOW()).day + '.json', JSON.stringify({ app: VER, at: new Date(NOW()).toISOString(), cfg: Object.assign({}, cfg, { alpKey: '', alpSecret: '', fhKey: '' }), recs: S.recs, near: S.near, scanlog: S.log }, null, 1), 'application/json'); }

// ===== واجهة =====
async function testConn() {
  const out = $('testOut'); out.innerHTML = '⏳ جاري الاختبار…'; const L = []; const add = (n, ok, m) => { L.push(`${ok ? '✅' : '❌'} ${n}${m ? ' — ' + esc(m) : ''}`); out.innerHTML = L.join('<br>'); };
  save(true); const t0 = NOW(), np = nyParts(t0), prev = addDays(np.day, -3);
  try { const j = await alp('/v1beta1/screener/stocks/movers?top=5'); add('الأكثر ارتفاعاً (screener/movers)', true, (j.gainers || []).slice(0, 3).map(x => x.symbol).join(', ')); } catch (e) { add('الأكثر ارتفاعاً (screener/movers)', false, e.message + ' — بديلها: القائمة الثابتة'); }
  try { const j = await alp('/v1beta1/screener/stocks/most-actives?by=volume&top=5'); add('الأكثر نشاطاً (most-actives)', true, (j.most_actives || []).slice(0, 3).map(x => x.symbol).join(', ')); } catch (e) { add('الأكثر نشاطاً (most-actives)', false, e.message); }
  try { const j = await alp('/v2/stocks/snapshots?feed=iex&symbols=AAPL,SPY'); const m = j.snapshots || j; add('لقطات الأسعار (snapshots)', !!(m.AAPL && m.AAPL.latestTrade), m.AAPL && m.AAPL.latestTrade ? 'AAPL $' + m.AAPL.latestTrade.p : 'استجابة فاضية'); } catch (e) { add('لقطات الأسعار (snapshots)', false, e.message); }
  try { const r = await barsQ(['AAPL'], '1Day', t0 - 12 * 864e5, nyWallToMs(np.day, 0, 0) - 1000, null); add('شموع يومية (حجم كامل)', (r.AAPL || []).length > 0, (r.AAPL || []).length + ' شمعة'); } catch (e) { add('شموع يومية (حجم كامل)', false, e.message); }
  try { const r = await barsQ(['AAPL'], '5Min', t0 - 6 * 864e5, nyWallToMs(prev, 16, 0), 'iex'); add('شموع 5 دقائق تاريخية IEX (خط أساس الحجم)', (r.AAPL || []).length > 0, (r.AAPL || []).length + ' شمعة'); } catch (e) { add('شموع 5 دقائق تاريخية IEX', false, e.message); }
  try { const r = await barsQ(['AAPL'], '1Min', t0 - 5 * 864e5, nyWallToMs(prev, 16, 0), 'sip'); add('شموع دقيقة SIP (للتدقيق بعد الإغلاق)', (r.AAPL || []).length > 0, (r.AAPL || []).length + ' شمعة'); } catch (e) { add('شموع دقيقة SIP (للتدقيق)', false, e.message + ' — سيُستخدم IEX بدلها'); }
  if (cfg.fhKey) { try { const r = await fetch('https://finnhub.io/api/v1/company-news?symbol=AAPL&from=' + addDays(np.day, -3) + '&to=' + np.day + '&token=' + encodeURIComponent(cfg.fhKey)); const j = await r.json(); add('أخبار Finnhub', Array.isArray(j), Array.isArray(j) ? j.length + ' خبر' : (j.error || 'خطأ')); } catch (e) { add('أخبار Finnhub', false, e.message); } } else add('أخبار Finnhub', false, 'لا مفتاح (اختياري)');
  try { const r = await ntfySend('✅ Scalping Assistant', 'اختبار التنبيه: لو وصلك هذا الإشعار على الجوال فالربط شغّال', 3, 'white_check_mark'); add('إشعار الجوال (ntfy) — شيّك جوالك', r.ok, 'HTTP ' + r.status); } catch (e) { add('إشعار الجوال (ntfy)', false, e.message + ' — جرّب فتح ntfy.sh من المتصفح للتأكد من الاتصال'); }
  beep('rec');
}
function save(quiet) {
  for (const f of FIELDS) { if (f[0] === 'h') continue; const el = $('f_' + f[0]); if (!el) continue; cfg[f[0]] = f[2] === 'number' ? (+el.value || 0) : el.value.trim(); }
  for (const k of ['scanOn', 'sound', 'noEtf']) if ($('f_' + k)) cfg[k] = $('f_' + k).checked;
  if ($('f_theme')) cfg.theme = $('f_theme').value; saveCfg(); applyTheme(); S.uniAt = 0; if (!quiet) toast('✅ تم الحفظ');
}
function applyTheme() { const t = cfg.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : cfg.theme; document.documentElement.setAttribute('data-theme', t); }
function setTab(t) { document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + t)); if (t === 'log') renderLog(); if (t === 'set') renderSettings(); if (t === 'recs') renderRecs(); }
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));

window.SA = { cfg, S, cycle, evaluate, planOf, metrics, outcome, replay, auditDay, maybeAudit, renderAll, fire, nyParts, nyWallToMs, recRow, stats,
  save, test: testConn, csv: exportCSV, json: exportJSON, theme() { cfg.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; saveCfg(); applyTheme(); },
  uf(id, f, v) { const r = S.recs.find(x => x.id === id); if (!r) return; r.user = r.user || {}; r.user[f] = f === 'note' ? v : f === 'executed' ? v : (v === '' ? null : parseFloat(v)); saveRecs(); },
  perm() { if ('Notification' in window) Notification.requestPermission().then(p => toast(p === 'granted' ? '✅ الإشعارات مفعّلة' : 'لم تُفعَّل')); beep('rec'); },
  clearDay() { S.ctx = {}; S.bars = {}; S.watch = {}; S.news = {}; S.uniAt = 0; toast('تم مسح كاش اليوم'); },
  wipe() { if (confirm('حذف كل التوصيات والسجل؟ (صدّر أول لو تبي نسخة)')) { S.recs = []; S.near = []; S.log = []; saveRecs(); saveNear(); jset('sa3.scanlog', []); renderAll(); } } };

// ===== التشغيل =====
document.addEventListener('DOMContentLoaded', () => {
  $('ver').textContent = 'نسخة ' + VER; applyTheme(); renderAll(); renderSettings();
  if ('serviceWorker' in navigator && !window.__noLoop) navigator.serviceWorker.register('/sw.js').catch(() => {});
  setInterval(() => { renderHead(); tickCounters(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); renderAll(); } });
  if (!window.__noLoop) (async function loop() { for (;;) { const np = nyParts(NOW()), mins = np.h * 60 + np.mi; try { if (cfg.scanOn) { keepAwake(); await cycle(); } } catch (e) {} try { await maybeAudit(); } catch (e) {} await wait(marketOpen(np, mins) ? 15000 : 60000); } })();
});
let wl = null; async function keepAwake() { try { if ('wakeLock' in navigator && !wl && !document.hidden) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }
})();
</script>
